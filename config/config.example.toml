# Copy to config/config.toml (git-ignored) and edit.

[goal]
daily_minutes = 120          # study goal per day
reward_ratio = 0.5           # earn 0.5 min free time per 1 min studied (Phase 3)

[tracking]
sample_seconds = 5           # how often the focused window is checked
idle_seconds = 180           # no mouse/window/title change for this long = idle, not counted
                             # (an audible allowed Brave tab remains active for lectures)
# Hyprland window classes that CAN count as study (check with: hyprctl activewindow -j)
study_window_classes = ["brave-browser", "Brave-browser"]
browser_classes = ["brave-browser", "Brave-browser"]   # site rules apply only to these
require_extension = false    # true = Brave counts ONLY when the extension reports an allowed site
tab_stale_seconds = 90       # extension info older than this is ignored
# Always-allowed apps (never locked) - used from Phase 3
always_allowed_classes = ["kitty", "foot", "code", "Code", "brave-browser", "Brave-browser"]

[study_sites]                # used from Phase 2 (Brave extension)
allow = ["docs.python.org", "developer.mozilla.org", "github.com", "stackoverflow.com"]
block = ["instagram.com", "x.com", "netflix.com"]
mixed = ["youtube.com"]      # counts only if the title matches study_keywords; /shorts never counts
study_keywords = ["tutorial", "lecture", "course", "python", "dsa"]

[api]
host = "127.0.0.1"           # local only. Never bind 0.0.0.0 without auth (Phase 4+)
port = 8765

[storage]
db_path = "~/.local/share/tapasya/tapasya.db"

# Lock engine: disabled by default; when enabled, dry-run remains on until explicitly changed.
[lock]
enabled = false
dry_run = true
check_seconds = 15
warn_seconds = 45
startup_grace_seconds = 120
max_closes_per_cycle = 2
active_from = "06:00"
active_until = "23:00"
override_delay_minutes = 10
override_minutes = 60
extra_allowed_classes = []
