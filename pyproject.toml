[project]
name = "tapasya"
version = "0.1.0"
description = "Study-first PC lock with streaks, AI-assistant hooks and an opt-in accountability dashboard"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tapasya = "tapasya.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["daemon/src"]

[tool.setuptools.package-data]
tapasya = ["schema.sql"]
